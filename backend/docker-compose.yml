version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: retrograde_postgres
    environment:
      POSTGRES_USER: retrograde
      POSTGRES_PASSWORD: retrograde_password
      POSTGRES_DB: retrograde_dev
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql

volumes:
  postgres_data:
